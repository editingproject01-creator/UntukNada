<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hai Nada...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Overlay Tombol Awal untuk Mengatasi Pemblokiran Autoplay Audio */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .btn-buka {
            padding: 15px 30px;
            font-size: 1.1rem;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
            transition: transform 0.2s, background 0.2s;
            font-weight: bold;
        }

        .btn-buka:hover {
            transform: scale(1.08);
            background: #ee5253;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .chat-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            text-align: left;
        }

        .pesan {
            font-size: 1.05rem;
            color: #333;
            background: #f1f0f0;
            padding: 12px 16px;
            border-radius: 15px;
            border-bottom-left-radius: 2px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
            display: none;
            line-height: 1.4;
        }

        .pesan.show {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        .pesan-spesial {
            background: #ffe6e6;
            color: #d63031;
            font-weight: 600;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .btn-container.show {
            opacity: 1;
            pointer-events: auto;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-ya {
            background-color: #ff6b6b;
            color: white;
        }

        .btn-ya:hover {
            background-color: #ee5253;
            transform: scale(1.05);
        }

        .btn-ragu {
            background-color: #e0e0e0;
            color: #555;
        }

        .btn-ragu:hover {
            background-color: #d6d6d6;
        }

        #respon {
            margin-top: 15px;
            font-weight: 600;
            color: #ff6b6b;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <!-- Overlay Mulai & Musik -->
    <div class="overlay" id="overlay">
        <button class="btn-buka" onclick="mulaiPesan()">Ada pesan buat Nada 📩</button>
    </div>

    <!-- Audio Backsound Utamamu -->
    <audio id="backsound" loop>
        <source src="musik.mp3" type="audio/mpeg">
    </audio>

    <!-- Audio Efek Suara Tombol (Ganti src sesuai nama file kamu nanti) -->
    <audio id="soundBolehbgt">
        <source src="hore.mp3" type="audio/mpeg">
    </audio>

    <audio id="soundNanti">
        <source src="yahh.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <div class="chat-box">
            <div id="pesan1" class="pesan">Assalamu'alaikum Nada Sabiluna 🍁</div>
            <div id="pesan2" class="pesan">Rasanya udah lumayan lama ya kita ga ngobrol...</div>
            <div id="pesan3" class="pesan">Gimana kabarmu sekarang? Semoga sehat dan lancar terus ya aktivitasnya.</div>
            <div id="pesan4" class="pesan pesan-spesial">Btw... kamu mau nitip sesuatu dari indo engga? aku akhir november insyallah balik ke sana ✈️😄</div>
        </div>

        <div id="btnGroup" class="btn-container">
            <button class="btn-ya" onclick="jawaban('Oke, kamu chat aku ya', 'soundBolehbgt')">Boleh banget!</button>
            <button class="btn-ragu" onclick="jawaban('Oke, aku tunggu kabarnya', 'soundNanti')">Nanti dikabari lagi</button>
        </div>

        <p id="respon"></p>
    </div>

    <script>
        function mulaiPesan() {
            // Sembunyikan Overlay
            const overlay = document.getElementById("overlay");
            overlay.style.opacity = "0";
            overlay.style.visibility = "hidden";

            // Putar Musik Latar
            const audio = document.getElementById("backsound");
            audio.volume = 0.5; // Volume musik latar
            audio.play();

            // Jalankan animasi teks bergantian
            setTimeout(() => {
                tampilkanPesan("pesan1");
            }, 500);

            setTimeout(() => {
                tampilkanPesan("pesan2");
            }, 2000);

            setTimeout(() => {
                tampilkanPesan("pesan3");
            }, 3800);

            setTimeout(() => {
                tampilkanPesan("pesan4");
                document.getElementById("btnGroup").classList.add("show");
            }, 5500);
        }

        function tampilkanPesan(id) {
            const el = document.getElementById(id);
            el.classList.add("show");
        }

        function jawaban(teks, soundId) {
            // Putar efek suara yang dipanggil
            const sfx = document.getElementById(soundId);
            if (sfx) {
                sfx.currentTime = 0; // Reset ke detik awal jika diklik berulang
                sfx.play();
            }

            // Tampilkan teks respons
            const responEl = document.getElementById("respon");
            responEl.innerText = "Luqman: " + teks;
        }
    </script>

</body>
</html>
